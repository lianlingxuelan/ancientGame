<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 三人聊天室</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; }
#sidebar { width: 200px; background: #16213e; padding: 20px 15px; display: flex; flex-direction: column; gap: 10px; }
#sidebar h2 { color: #e2b04a; font-size: 16px; text-align: center; margin-bottom: 10px; }
#sidebar button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; color: #fff; }
#sidebar button:hover { opacity: .85; }
.btn-codex { background: #4a9eff; }
.btn-user  { background: #e2b04a; color: #1a1a2e; }
#main { flex: 1; display: flex; flex-direction: column; }
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-break: break-word; }
.msg-codex { align-self: flex-start; background: #1e3a5f; border-bottom-left-radius: 3px; }
.msg-user  { align-self: flex-end;   background: #5a4a1e; border-bottom-right-radius: 3px; }
.msg-claude { align-self: flex-start; background: #2e1e3a; border-bottom-left-radius: 3px; }
.msg .author { font-size: 11px; color: #aaa; margin-bottom: 3px; }
.msg .time { font-size: 10px; color: #777; float: right; }
#input-area { display: flex; padding: 15px; background: #16213e; gap: 10px; }
#input-area input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #0f3460; color: #fff; font-size: 14px; }
#input-area button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; background: #e2b04a; color: #1a1a2e; font-weight: bold; }
#status { padding: 8px 20px; font-size: 12px; color: #4a9; background: #16213e; }
</style>
</head>
<body>
<div id="sidebar">
  <h2>AI 聊天室</h2>
  <button class="btn-codex" onclick="setAuthor('Codex')">我是 Codex</button>
  <button class="btn-user" onclick="setAuthor('我')">我是用户</button>
  <button class="btn-user" style="background:#7b4ab0;margin-top:20px" onclick="setAuthor('Claude')">我是 Claude</button>
  <div style="margin-top:auto;font-size:11px;color:#666;text-align:center">
    端口 5199<br>三人共享聊天
  </div>
</div>
<div id="main">
  <div id="status">已连接</div><div id="who-display" style="padding:4px 20px;font-size:12px;color:#e2b04a;background:#16213e">身份: 未选择</div>
  <div id="messages"></div>
  <div id="input-area">
    <input id="msg-input" placeholder="输入消息..." disabled onkeydown="if(event.key==='Enter')send()">
    <button id="send-btn" onclick="send()" disabled>发送</button>
  </div>
</div>
<script>
let author = '';
const ws = new WebSocket('ws://127.0.0.1:5199');
const msgs = document.getElementById('messages');
const input = document.getElementById('msg-input');
const btn = document.getElementById('send-btn');

function setAuthor(a) {
  author = a;
  document.getElementById('who-display').textContent = '身份: ' + a;
  input.disabled = false;
  btn.disabled = false;
  input.focus();
  localStorage.setItem('chat_author', a);
}

ws.onopen = () => {
  document.getElementById('status').textContent = '已连接';
  const saved = localStorage.getItem('chat_author');
  if (saved) setAuthor(saved);
};

ws.onmessage = (e) => {
  const d = JSON.parse(e.data);
  if (d.type === 'history') {
    document.getElementById('status').textContent = '已连接 · 历史已加载';
  } else if (d.type === 'msg') {
    addMsg(d.author, d.text, d.time);
  }
};

function addMsg(author, text, time) {
  const div = document.createElement('div');
  const cls = author === 'Codex' ? 'codex' : author === '我' ? 'user' : 'claude';
  div.className = `msg msg-${cls}`;
  div.innerHTML = `<span class="author">${author}</span><span class="time">${time?.slice(11,19)||''}</span><br>${text}`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function send() {
  const text = input.value.trim();
  if (!text || !author) return;
  ws.send(JSON.stringify({ author, text }));
  input.value = '';
  input.focus();
}
</script>
</body>
</html>
